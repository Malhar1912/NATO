[project]
name = "nato-opt"
version = "0.1.2"
authors = [
    { name="Malhar Pangarkar" },
    { name="Atharva Khambete" },
    { email="malharpangarkar19@gmail.com" },
    { email="atharvakhambete1@gmail.com" }
]
description = "NATO Optimizer with Fourier Spectral Penalty (FSP), Kakeya Directional Penalty, and N-D FFT gradient filtering"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["torch", "numpy"]
keywords = ["pytorch", "optimizer", "deep-learning", "fourier", "spectral-penalty", "gradient-filtering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Malhar1912/NATO"
Repository = "https://github.com/Malhar1912/NATO"
Issues = "https://github.com/Malhar1912/NATO/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

